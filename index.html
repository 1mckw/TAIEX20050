<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAIEX → 0050 / 0050反 換算</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <p class="eyebrow">即時換算工具</p>
      <h1>0050 / 0050反 價格推算</h1>
      <div class="status-bar">
        <span id="status" class="status-text">載入中…</span>
        <span id="countdown" class="status-countdown">--</span>
      </div>
    </header>

    <section class="calc-panel" aria-label="價格換算">
      <div class="panel-toolbar">
        <label class="field-compact">
          <span class="field-label">換算方法</span>
          <select id="method">
            <option value="spread" selected>價差法</option>
            <option value="ratio">倍率法</option>
            <option value="regression">迴歸法</option>
          </select>
        </label>
        <button id="refresh-btn" type="button" class="btn-refresh">立即更新</button>
      </div>

      <div class="section-block">
        <h2 class="section-title">輸入點位</h2>

        <div class="mode-tabs" role="tablist" aria-label="標的類型">
          <button type="button" class="mode-tab active" data-mode="taiex" role="tab" aria-selected="true">TAIEX</button>
          <button type="button" class="mode-tab" data-mode="tx" role="tab" aria-selected="false">TAIEX FUTURES</button>
        </div>

        <div class="input-grid">
          <label class="field">
            <span class="field-label" id="input-label">TAIEX 點位</span>
            <input id="price-input" type="number" step="0.01" inputmode="decimal" placeholder="例如 44500">
          </label>
          <label class="field basis-field hidden" id="basis-wrap">
            <span class="field-label">基差 <span class="field-hint">FUTURES − TAIEX</span></span>
            <input id="basis" type="number" step="1" inputmode="numeric" value="0" placeholder="0">
          </label>
          <div class="field field-action">
            <span class="field-label">快速帶入</span>
            <button type="button" id="latest-btn" class="btn-secondary">帶入最新 TAIEX</button>
          </div>
        </div>

        <p class="conversion-note hidden" id="implied-taiex-line">
          <span id="tx-source-line">TAIEX FUTURES --</span>
          <span class="arrow" aria-hidden="true">→</span>
          <span>隱含 TAIEX <strong id="implied-taiex">--</strong></span>
        </p>
      </div>

      <div class="section-block results-block">
        <h2 class="section-title">推算結果</h2>
        <div class="calc-results">
          <article class="result-card">
            <span class="result-label">0050</span>
            <span class="result-value" id="implied-etf50">--</span>
            <span class="result-unit">元</span>
          </article>
          <article class="result-card inverse">
            <span class="result-label">0050反</span>
            <span class="result-value" id="implied-etf-inv">--</span>
            <span class="result-unit">元</span>
          </article>
        </div>
      </div>
    </section>

    <footer class="meta">
      <p>TAIEX / FUTURES 來源 <a href="https://www.tradingview.com/symbols/INDEX-TAIEX/" target="_blank" rel="noopener">TradingView</a>　｜　0050 / 0050反 來源 Yahoo Finance</p>
      <p class="meta-note">每 5 分鐘更新 · 僅供參考，非投資建議</p>
    </footer>
  </div>
  <script src="app.js?v=11"></script>
</body>
</html>
